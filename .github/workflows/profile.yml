name: Refresh Profile

on:
  schedule:
    - cron: "0 4 * * *"   # Runs daily at 04:00 UTC
  workflow_dispatch:      # Allows manual trigger via "Run workflow" button
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_profile_data.py

      - name: Generate SVGs and README
        run: python scripts/gen_profile.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/profile.json assets/stage README.md
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: auto-refresh profile stats [skip ci]"
            git push
          fi
